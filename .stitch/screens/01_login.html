<body class="bg-azul-noite-absoluto text-branco-neblina font-body min-h-screen flex flex-col justify-between items-center p-4 selection:bg-ciano-tecnico selection:text-ciano-profundo">
<!-- Top bar status indicator anchor -->
<!-- Central Authentication Card -->
<main class="w-full flex-1 flex items-center justify-center py-6">
<div class="w-full max-w-[420px] bg-ardosia-profunda rounded-xl border border-borda-sutil p-8 shadow-none transition-colors duration-150">
<!-- Brand & Header -->
<div class="mb-space-lg text-left">
<div class="flex items-center gap-space-xs mb-space-md">
<div class="w-8 h-8 rounded-lg bg-azul-noite-barra border border-borda-sutil flex items-center justify-center text-ciano-tecnico">
<span class="material-symbols-outlined text-ciano-tecnico" data-icon="radar">radar</span>
</div>
<span class="font-page-title text-page-title text-branco-neblina tracking-tight">QAwler</span>
<span class="ml-1 px-1.5 py-0.5 rounded bg-borda-sutil text-cinza-azulado-claro font-technical-mono text-metadata">v1.0</span>
</div>
<h1 class="font-page-title text-page-title text-branco-neblina mb-1">Entrar na sua conta</h1>
<p class="font-body text-body text-cinza-azulado-claro">Acesse o painel de testes e inspeção contínua</p>
</div>
<!-- Real Error State Simulation -->
<!-- Authentication Form -->
<form class="space-y-space-md" onsubmit="event.preventDefault();">
<!-- Field: E-mail -->
<div class="space-y-1 text-left">
<div class="flex justify-between items-center">
<label class="font-body-medium text-body-medium text-branco-neblina" for="email-input">E-mail</label>
<span class="font-metadata text-metadata text-cinza-azulado-apagado">Corporativo</span>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 text-cinza-azulado-apagado pointer-events-none material-symbols-outlined" data-icon="mail">mail</span>
<input class="w-full h-10 bg-azul-noite-barra text-branco-neblina placeholder-cinza-azulado-apagado border border-borda-campo rounded-lg pl-9 pr-3 font-technical-mono text-technical-mono focus:outline-none focus:border-ciano-tecnico focus:ring-1 focus:ring-ciano-tecnico transition-colors duration-150" id="email-input" name="email" placeholder="dev@empresa.com.br" required="" type="email" value="qa.lead@empresa.com.br"/>
</div>
</div>
<!-- Field: Senha -->
<div class="space-y-1 text-left">
<div class="flex justify-between items-center">
<label class="font-body-medium text-body-medium text-branco-neblina" for="password-input">Senha</label>
<span class="font-metadata text-metadata text-cinza-azulado-apagado">mínimo 8 caracteres</span>
</div>
<div class="relative flex items-center">
<span class="absolute left-3 text-cinza-azulado-apagado pointer-events-none material-symbols-outlined" data-icon="key">key</span>
<input class="w-full h-10 bg-azul-noite-barra text-branco-neblina placeholder-cinza-azulado-apagado border border-borda-campo rounded-lg pl-9 pr-10 font-technical-mono text-technical-mono focus:outline-none focus:border-ciano-tecnico focus:ring-1 focus:ring-ciano-tecnico transition-colors duration-150" id="password-input" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Alternar visualização da senha" class="absolute right-2.5 p-1 text-cinza-azulado-apagado hover:text-ciano-tecnico transition-colors duration-150 rounded flex items-center justify-center" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Checkbox: Lembrar sessão -->
<div class="flex items-center gap-2 pt-0.5">
<input class="w-4 h-4 rounded bg-azul-noite-barra border-borda-campo text-ciano-tecnico focus:ring-0 focus:ring-offset-0 focus:border-ciano-tecnico transition-colors" id="remember-device" name="remember" type="checkbox"/>
<label class="font-body text-body text-cinza-azulado-claro select-none cursor-pointer" for="remember-device">
            Lembrar esta máquina por 30 dias
          </label>
</div>
<!-- Primary Action -->
<div class="pt-1">
<button class="w-full h-10 bg-primary-container hover:bg-primary-fixed-dim text-ciano-profundo font-body-medium text-body-medium rounded-lg flex items-center justify-center gap-2 transition-colors duration-150 cursor-pointer active:scale-[0.99]" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined font-semibold" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>

        </a>

<div class="flex items-center gap-2"><span>QAwler · v1.0</span></div>
<div class="flex items-center gap-4">
<a class="hover:text-ciano-tecnico transition-colors" href="#termos">Termos</a>
<a class="hover:text-ciano-tecnico transition-colors" href="#privacidade">Privacidade</a>
<a class="hover:text-ciano-tecnico transition-colors" href="#suporte">Suporte Técnico</a>
</div>

<!-- Simple password toggle micro-interaction -->
<script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password-input');
      const iconSpan = document.getElementById('password-toggle-icon');
      
      if (!passwordInput || !iconSpan) return;

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconSpan.textContent = 'visibility_off';
        iconSpan.setAttribute('data-icon', 'visibility_off');
      } else {
        passwordInput.type = 'password';
        iconSpan.textContent = 'visibility';
        iconSpan.setAttribute('data-icon', 'visibility');
      }
    }
  </script>
