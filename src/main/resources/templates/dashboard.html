<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAwler — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .sidebar {
            background: #1e293b;
            min-height: 100vh;
            border-right: 1px solid #334155;
            padding-top: 1rem;
        }
        .sidebar .nav-link { color: #94a3b8; border-radius: 0.5rem; margin: 0.15rem 0.5rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #334155; color: #38bdf8; }
        .sidebar .brand { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .main-content { padding: 2rem; }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .value { font-size: 2.5rem; font-weight: 700; }
        .stat-card .label { color: #94a3b8; font-size: 0.9rem; }
        .table-dark-custom { background: #1e293b; border-radius: 0.75rem; overflow: hidden; }
        .table-dark-custom thead { background: #334155; }
        .table-dark-custom th { color: #94a3b8; font-weight: 500; }
        .badge-queued  { background: #fbbf24; color: #0f172a; }
        .badge-running { background: #38bdf8; color: #0f172a; }
        .badge-done    { background: #34d399; color: #0f172a; }
        .badge-failed  { background: #f87171; color: #0f172a; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 sidebar d-flex flex-column">
            <div class="brand px-3 mb-4">QAwler</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/sistemas"><i class="bi bi-hdd-stack me-2"></i>Sistemas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/testes"><i class="bi bi-play-circle me-2"></i>Testes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/relatorios"><i class="bi bi-file-earmark-pdf me-2"></i>Relatórios</a>
                </li>
            </ul>
            <div class="mt-auto p-3">
                <a href="/logout" class="btn btn-outline-secondary btn-sm w-100">Sair</a>
            </div>
        </nav>

        <!-- Main -->
        <main class="col-md-9 col-lg-10 main-content">
            <h2 class="mb-4">Dashboard</h2>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="stat-card text-center">
                        <div class="value text-warning" th:text="${stats.queued}">0</div>
                        <div class="label">Na Fila</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card text-center">
                        <div class="value" style="color:#38bdf8;" th:text="${stats.running}">0</div>
                        <div class="label">Em Execução</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card text-center">
                        <div class="value" style="color:#34d399;" th:text="${stats.completed}">0</div>
                        <div class="label">Concluídos</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-card text-center">
                        <div class="value" style="color:#f87171;" th:text="${stats.failed}">0</div>
                        <div class="label">Falhas</div>
                    </div>
                </div>
            </div>

            <!-- Recent tests -->
            <div class="table-dark-custom p-3">
                <h5 class="mb-3">Testes Recentes</h5>
                <table class="table table-dark table-borderless mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Sistema</th>
                            <th>Status</th>
                            <th>Iniciado em</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="teste : ${testesRecentes}">
                            <td th:text="${teste.id}">1</td>
                            <td th:text="${teste.sistemaNome}">sistema</td>
                            <td>
                                <span th:class="'badge badge-' + ${teste.statusClass}"
                                      th:text="${teste.status}">QUEUED</span>
                            </td>
                            <td th:text="${teste.iniciadoEm}">-</td>
                            <td>
                                <a th:href="@{/testes/{id}(id=${teste.id})}"
                                   class="btn btn-sm btn-outline-info">Ver</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(testesRecentes)}">
                            <td colspan="5" class="text-center text-muted">Nenhum teste realizado</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
