<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAwler — Sistemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .card-custom {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .card-custom:hover { border-color: #38bdf8; }
        .card-custom h5 { color: #38bdf8; }
        .card-custom .url { color: #94a3b8; font-size: 0.85rem; }
        .card-custom .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; }
        .btn-outline-sky {
            border-color: #38bdf8; color: #38bdf8;
        }
        .btn-outline-sky:hover {
            background: #38bdf8; color: #0f172a;
        }
        .badge-ambiente-dev     { background: #fbbf24; color: #0f172a; }
        .badge-ambiente-staging { background: #f97316; color: #0f172a; }
        .badge-ambiente-prod    { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
<div class="container py-4">
    <nav class="mb-4">
        <a href="/dashboard" class="text-decoration-none" style="color:#38bdf8;">← Dashboard</a>
    </nav>

    <div class="page-header">
        <h2>Sistemas Monitorados</h2>
        <button class="btn btn-outline-sky" data-bs-toggle="modal" data-bs-target="#novoSistemaModal">
            <i class="bi bi-plus-circle me-1"></i> Novo Sistema
        </button>
    </div>

    <!-- List -->
    <div th:each="sistema : ${sistemas}" class="card-custom">
        <div class="row align-items-center">
            <div class="col-md-7">
                <h5 class="mb-1" th:text="${sistema.nome}">Nome do Sistema</h5>
                <span class="url" th:text="${sistema.urlBase}">https://example.com</span>
            </div>
            <div class="col-md-2">
                <span th:class="'badge badge-ambiente-' + ${sistema.ambienteClass}"
                      th:text="${sistema.ambiente}">DEV</span>
            </div>
            <div class="col-md-3 footer">
                <a th:href="@{/sistemas/{id}(id=${sistema.id})}"
                   class="btn btn-sm btn-outline-info">Detalhes</a>
                <form th:action="@{/api/testes}" method="post" class="d-inline">
                    <input type="hidden" name="sistemaId" th:value="${sistema.id}">
                    <button type="submit" class="btn btn-sm btn-outline-sky">
                        <i class="bi bi-play-fill"></i> Executar Testes
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(sistemas)}" class="text-center text-muted py-5">
        <i class="bi bi-inbox" style="font-size:3rem;"></i>
        <p class="mt-2">Nenhum sistema cadastrado</p>
    </div>
</div>

<!-- Modal Novo Sistema -->
<div class="modal fade" id="novoSistemaModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background:#1e293b; color:#e2e8f0;">
            <div class="modal-header" style="border-color:#334155;">
                <h5 class="modal-title">Novo Sistema</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/api/sistemas}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" name="nome" required
                               style="background:#0f172a; border-color:#334155; color:#e2e8f0;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL Base</label>
                        <input type="url" class="form-control" name="urlBase" required
                               style="background:#0f172a; border-color:#334155; color:#e2e8f0;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" name="descricao" rows="2"
                                  style="background:#0f172a; border-color:#334155; color:#e2e8f0;"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ambiente</label>
                        <select class="form-select" name="ambiente"
                                style="background:#0f172a; border-color:#334155; color:#e2e8f0;">
                            <option value="DEV">DEV</option>
                            <option value="STAGING">STAGING</option>
                            <option value="PROD">PROD</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="border-color:#334155;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-outline-sky">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
