<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAwler — Detalhes do Teste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; }
        .container { max-width: 960px; padding-top: 2rem; }
        .card-custom {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .section-title { color: #38bdf8; margin-bottom: 1rem; }
        .bug-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
        }
        .bug-item .severity-critical { color: #ef4444; font-weight: 600; }
        .bug-item .severity-high     { color: #f97316; font-weight: 600; }
        .bug-item .severity-medium   { color: #fbbf24; font-weight: 600; }
        .bug-item .severity-low      { color: #94a3b8; font-weight: 600; }
        .badge-queued  { background: #fbbf24; color: #0f172a; }
        .badge-running { background: #38bdf8; color: #0f172a; }
        .badge-completed { background: #34d399; color: #0f172a; }
        .badge-failed  { background: #f87171; color: #0f172a; }
        pre { color: #e2e8f0; margin: 0; }
    </style>
</head>
<body>
<div class="container">
    <nav class="mb-3">
        <a href="/dashboard" class="text-decoration-none" style="color:#38bdf8;">← Dashboard</a>
    </nav>

    <div class="card-custom">
        <div class="row">
            <div class="col-md-8">
                <h3 th:text="'Teste #' + ${teste.id}">Teste #1</h3>
                <p class="text-muted mb-1" th:text="'Sistema: ' + ${teste.sistemaNome}">Sistema: -</p>
                <p class="text-muted" th:text="'URL: ' + ${teste.urlBase}">URL: -</p>
            </div>
            <div class="col-md-4 text-md-end">
                <span th:class="'badge badge-' + ${teste.statusClass}"
                      th:text="${teste.status}" style="font-size:1rem; padding:0.5rem 1rem;">COMPLETED</span>
                <p class="text-muted mt-2" th:text="${teste.finalizadoEm}">-</p>
            </div>
        </div>
    </div>

    <!-- Bugs summary -->
    <div class="card-custom">
        <h4 class="section-title">
            <i class="bi bi-bug me-2"></i>Bugs Encontrados
            <span class="badge bg-secondary ms-2" th:text="${#lists.size(bugs)}">0</span>
        </h4>

        <div th:if="${#lists.isEmpty(bugs)}" class="text-center text-muted py-3">
            <i class="bi bi-check-circle" style="font-size:2rem; color:#34d399;"></i>
            <p class="mt-2">Nenhum bug encontrado!</p>
        </div>

        <div th:each="bug : ${bugs}" class="bug-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span th:class="'severity-' + ${bug.severidadeClass}"
                          th:text="${bug.severidade}">HIGH</span>
                    <span class="ms-2 text-muted" th:text="'[' + ${bug.tipo} + ']'">[HTTP_ERROR]</span>
                </div>
            </div>
            <p class="mt-1 mb-0" th:text="${bug.mensagem}">Mensagem do bug</p>
            <small class="text-muted" th:text="${bug.detalhe}">Detalhe</small>
        </div>
    </div>

    <!-- Scan results detail -->
    <div class="card-custom">
        <h4 class="section-title">
            <i class="bi bi-search me-2"></i>Resultados dos Scanners
        </h4>

        <div th:each="scanner : ${scannerResults}" class="mb-3">
            <h6 th:text="${scanner.nome} + ' — ' + ${scanner.issueCount} + ' issues'"
                style="color:#94a3b8;">HTTP Scanner — 0 issues</h6>
            <div th:if="${scanner.passed}" class="text-success small">
                <i class="bi bi-check-circle"></i> Passou
            </div>
            <div th:unless="${scanner.passed}" class="text-warning small">
                <i class="bi bi-exclamation-triangle"></i> Problemas detectados
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="d-flex gap-2 mb-4">
        <form th:action="@{/api/testes}" method="post" class="d-inline">
            <input type="hidden" name="sistemaId" th:value="${teste.sistemaId}">
            <button type="submit" class="btn btn-outline-sky">
                <i class="bi bi-arrow-repeat me-1"></i> Reexecutar
            </button>
        </form>
        <form th:action="@{/api/relatorios/pdf}" method="post" class="d-inline">
            <input type="hidden" name="testeId" th:value="${teste.id}">
            <input type="hidden" name="sistemaNome" th:value="${teste.sistemaNome}">
            <button type="submit" class="btn btn-outline-light">
                <i class="bi bi-file-earmark-pdf me-1"></i> Baixar PDF
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
