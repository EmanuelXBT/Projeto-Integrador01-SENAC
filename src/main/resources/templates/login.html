<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAwler — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .login-card h1 {
            color: #38bdf8;
            font-weight: 700;
        }
        .login-card .subtitle {
            color: #94a3b8;
        }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.2rem rgba(56,189,248,0.25);
            color: #e2e8f0;
        }
        .btn-primary {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #0ea5e9;
            border-color: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h1>QAwler</h1>
            <p class="subtitle">Varredura automatizada de QA</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label text-light">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="seu@email.com" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-light">Senha</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
        </form>

        <p class="text-center mt-4 mb-0" style="color: #64748b; font-size: 0.85rem;">
            QAwler v0.1.0 — Projeto Integrador SENAC
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
