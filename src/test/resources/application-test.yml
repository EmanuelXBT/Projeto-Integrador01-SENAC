# Perfil de teste — H2 em memória; não usa MySQL, RabbitMQ nem navegador.
# Rodar: mvn test
spring:
  datasource:
    url: jdbc:h2:mem:qawler_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
        missing-queues-fatal: false

qawler:
  jwt:
    secret: chave-de-teste-com-mais-de-32-caracteres-para-hmac-sha
    expiration-ms: 3600000

aes:
  secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

crawler:
  assistido:
    habilitado: true
    # Binário inexistente de propósito: o teste do modo M1 falha com mensagem clara,
    # sem abrir nenhuma janela na máquina de quem roda a suíte.
    binario: /caminho/inexistente/do/chrome
    perfil: ${java.io.tmpdir}/qawler-teste/perfil
    porta: 9222
    timeout-conexao-ms: 500
